<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LocalSend 键盘</title>
<style>
  :root {
    --primary: #006A60;
    --on-primary: #FFFFFF;
    --primary-container: #9EF2E4;
    --secondary-container: #CCE8E2;
    --on-secondary-container: #334B47;
    --surface: #F4FBF8;
    --surface-low: #EFF5F2;
    --on-surface: #161D1C;
    --on-surface-variant: #3F4947;
    --outline-variant: #BEC9C6;
    --error: #BA1A1A;
    --pill-bg: rgba(255, 255, 255, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #82D5C8;
      --on-primary: #003731;
      --primary-container: #005048;
      --secondary-container: #334B47;
      --on-secondary-container: #CCE8E2;
      --surface: #0E1513;
      --surface-low: #161D1C;
      --on-surface: #DDE4E1;
      --on-surface-variant: #BEC9C6;
      --outline-variant: #3F4947;
      --error: #FFB4AB;
      --pill-bg: rgba(255, 255, 255, .12);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  header {
    background: var(--primary);
    color: var(--on-primary);
    padding: 12px 16px;
  }
  .head-row { display: flex; align-items: center; gap: 10px; }
  .head-row h1 { font-size: 17px; margin: 0; font-weight: 600; flex: 1; }
  .transfer-link {
    color: var(--on-primary);
    border: 1px solid rgba(255, 255, 255, .65);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    text-decoration: none;
    white-space: nowrap;
  }
  .transfer-link:active { opacity: .8; }
  .pill {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--pill-bg);
    white-space: nowrap;
  }
  .pill.gray::before { content: "● "; opacity: .7; }
  .pill.green::before { content: "● "; }
  .pill.red::before { content: "● "; }
  .sub { font-size: 12px; margin-top: 4px; opacity: .85; }
  #banner {
    font-size: 13px; padding: 8px 16px; display: none;
  }
  #banner.err { background: var(--error); color: var(--on-primary); }
  #banner.warn { background: #FFF3E0; color: #7A4E00; }
  main { flex: 1; display: flex; flex-direction: column; padding: 12px 16px 0; gap: 10px; min-height: 0; }
  #hint { font-size: 12.5px; color: var(--on-surface-variant); }
  #ta {
    flex: 1; min-height: 120px; resize: none;
    border: 1px solid var(--outline-variant); border-radius: 5px;
    background: var(--secondary-container); color: var(--on-surface);
    font-size: 16px; padding: 10px 12px; outline: none; width: 100%;
  }
  #ta:focus { border-color: var(--primary); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
  .tools button {
    border: 0; border-radius: 999px; font-size: 13px; padding: 8px 14px;
    background: var(--secondary-container); color: var(--on-secondary-container);
  }
  .tools button.primary { background: var(--primary); color: var(--on-primary); font-weight: 600; }
  .tools button.outlined { background: transparent; color: var(--on-surface-variant); border: 1px solid var(--outline-variant); }
  .tools button:active { filter: brightness(.92); }
  footer { font-size: 11.5px; color: var(--on-surface-variant); text-align: center; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>⌨ LocalSend 键盘</h1>
    <a id="transferLink" class="transfer-link" href="#">传输文件</a>
    <span id="pill" class="pill gray">等待连接</span>
  </div>
  <div class="sub" id="hostLine"></div>
</header>
<div id="banner"></div>
<main>
  <div id="hint">点击下方输入框开始打字，文字将实时上屏到电视</div>
  <textarea id="ta" placeholder="在此输入…"></textarea>
  <div class="tools">
    <button id="bs" class="">⌫ 退格</button>
    <button id="word" class="">删词</button>
    <button id="forward" class="">删右侧</button>
    <button id="left" class="outlined">←</button>
    <button id="right" class="outlined">→</button>
    <button id="home" class="outlined">行首</button>
    <button id="end" class="outlined">行尾</button>
    <button id="enter" class="primary">↵ Enter</button>
    <button id="tab" class="outlined">Tab</button>
    <button id="selectAll" class="outlined">全选</button>
    <button id="copy" class="outlined">复制</button>
    <button id="cut" class="outlined">剪切</button>
    <button id="paste" class="outlined">粘贴</button>
  </div>
</main>
<footer>由电视上的 LocalSend 提供 · 输入内容仅经局域网传输</footer>
<script>
(function () {
  function getQueryParam(name) {
    var query = location.search.slice(1).split('&');
    for (var i = 0; i < query.length; i++) {
      var separator = query[i].indexOf('=');
      var key = separator < 0 ? query[i] : query[i].slice(0, separator);
      if (key === name) {
        var value = separator < 0 ? '' : query[i].slice(separator + 1);
        try {
          return decodeURIComponent(value.replace(/\+/g, ' '));
        } catch (e) {
          return value;
        }
      }
    }
    return null;
  }
  var pin = getQueryParam('pin') || '';
  var host = getQueryParam('host') || '';

  var ta = document.getElementById('ta');
  var pill = document.getElementById('pill');
  var transferLink = document.getElementById('transferLink');
  var transferHost = location.hostname.indexOf(':') >= 0 ? '[' + location.hostname + ']' : location.hostname;
  var transferScheme = qs.get('transferScheme') || 'http';
  var transferPort = qs.get('transferPort') || '53317';
  var transferQuery = '?tv=1' + (pin ? '&pin=' + encodeURIComponent(pin) : '');
  transferLink.href = transferScheme + '://' + transferHost + ':' + encodeURIComponent(transferPort) + '/' + transferQuery;

  var banner = document.getElementById('banner');
  var hint = document.getElementById('hint');

  // TV-side model synced with our ops
  var tvModel = '';
  var tvCursor = 0;
  var composing = false;
  var snapshotReady = false;
  var started = false;

  function apiUrl(path) {
    var join = path.indexOf('?') >= 0 ? '&' : '?';
    return path + join + 'pin=' + encodeURIComponent(pin);
  }

  function postJson(path, body) {
    return fetch(apiUrl(path), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }

  function getJson(path) {
    return fetch(apiUrl(path)).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }

  function syncSnapshot() {
    return getJson('/kb/snapshot').then(function (s) {
      if (!s.ok) throw new Error(s.error || 'snapshot unavailable');
      tvModel = s.text || '';
      tvCursor = Math.max(0, (s.selectionStart || 0) - (s.startOffset || 0));
      ta.value = tvModel;
      ta.selectionStart = ta.selectionEnd = Math.min(tvCursor, ta.value.length);
      snapshotReady = true;
    });
  }

  function setPill(cls, text) { pill.className = 'pill ' + cls; pill.textContent = text; }
  function showBanner(cls, text) { banner.className = cls; banner.style.display = 'block'; banner.textContent = text; }
  function hideBanner() { banner.style.display = 'none'; }

  // ---------- diff ----------
  function diff(oldStr, newStr) {
    var p = 0;
    var minLen = Math.min(oldStr.length, newStr.length);
    while (p < minLen && oldStr.charCodeAt(p) === newStr.charCodeAt(p)) p++;
    var s = 0;
    var maxS = Math.min(oldStr.length - p, newStr.length - p);
    while (s < maxS && oldStr.charCodeAt(oldStr.length - 1 - s) === newStr.charCodeAt(newStr.length - 1 - s)) s++;
    return { p: p, removed: oldStr.length - p - s, inserted: newStr.slice(p, newStr.length - s) };
  }

  function buildOps(oldStr, newStr) {
    var d = diff(oldStr, newStr);
    var ops = [];
    if (d.removed > 0) {
      ops.push({ op: 'sel', a: d.p + d.removed, b: d.p + d.removed });
      ops.push({ op: 'del', before: d.removed, after: 0 });
    }
    if (d.inserted) {
      if (d.removed === 0) ops.push({ op: 'sel', a: d.p, b: d.p });
      ops.push({ op: 'ins', text: d.inserted });
    }
    return { ops: ops, cursor: d.p + d.inserted.length };
  }

  // serialize all writes; each op waits for the previous one
  var chain = Promise.resolve();
  function enqueue(ops) {
    if (!ops.length) return;
    chain = chain.then(function () {
      var p = Promise.resolve();
      ops.forEach(function (op) {
        p = p.then(function () { return postJson('/kb/text', op); }).then(function (res) {
          if (res && res.applied === false) throw new Error('not applied');
        });
      });
      return p;
    }).then(function () {
      hideBanner();
    }).catch(function (e) {
      setPill('red', '发送失败，重试中…');
      throw e;
    });
  }

  function handleDiff() {
    if (!started) { started = true; hint.style.display = 'none'; }
    if (!snapshotReady) return;
    var next = ta.value;
    var r = buildOps(tvModel, next);
    enqueue(r.ops);
    tvModel = next;
    tvCursor = r.cursor;
  }

  ta.addEventListener('compositionstart', function () { composing = true; });
  ta.addEventListener('compositionend', function () { composing = false; handleDiff(); });
  ta.addEventListener('input', function (e) {
    if (e.isComposing || composing) return;
    handleDiff();
  });

  // ---------- tools ----------
  function tvBackspace() {
    if (tvCursor <= 0) return;
    var ops = [
      { op: 'sel', a: tvCursor, b: tvCursor },
      { op: 'del', before: 1, after: 0 }
    ];
    enqueue(ops);
    // keep the browser caret roughly in sync
    var el = ta.selectionStart;
    if (el > 0 && ta.value.slice(0, el) === tvModel.slice(0, el)) {
      ta.value = ta.value.slice(0, el - 1) + ta.value.slice(el);
      ta.selectionStart = ta.selectionEnd = el - 1;
    }
    tvModel = ta.value;
    tvCursor--;
  }

  function bindHold(el, fn) {
    var timer = null, repeat = null;
    el.addEventListener('touchstart', function (e) { e.preventDefault(); fn(); timer = setTimeout(function () {
      repeat = setInterval(fn, 80);
    }, 350); }, { passive: false });
    el.addEventListener('touchend', function () { clearTimeout(timer); clearInterval(repeat); });
    el.addEventListener('touchcancel', function () { clearTimeout(timer); clearInterval(repeat); });
    el.addEventListener('click', function () { if (!('ontouchstart' in window)) fn(); });
  }

  bindHold(document.getElementById('bs'), tvBackspace);
  document.getElementById('left').addEventListener('click', function () {
    if (tvCursor > 0) { enqueue([{ op: 'relmove', dx: -1 }]); tvCursor--; }
  });
  document.getElementById('right').addEventListener('click', function () {
    if (tvCursor < tvModel.length) { enqueue([{ op: 'relmove', dx: 1 }]); tvCursor++; }
  });
  document.getElementById('enter').addEventListener('click', function () {
    enqueue([{ op: 'key', code: 'enter' }]);
  });
  document.getElementById('tab').addEventListener('click', function () {
    enqueue([{ op: 'key', code: 'tab' }]);
  });
  document.getElementById('word').addEventListener('click', function () {
    enqueue([{ op: 'key', code: 'deleteWord' }]);
  });
  document.getElementById('forward').addEventListener('click', function () {
    enqueue([{ op: 'del', before: 0, after: 1 }]);
  });
  document.getElementById('home').addEventListener('click', function () {
    enqueue([{ op: 'key', code: 'home' }]);
  });
  document.getElementById('end').addEventListener('click', function () {
    enqueue([{ op: 'key', code: 'end' }]);
  });
  ['selectAll', 'copy', 'cut', 'paste'].forEach(function (name) {
    document.getElementById(name).addEventListener('click', function () {
      enqueueAction(name);
    });
  });
  function enqueueAction(action) {
    chain = chain.then(function () { return postJson('/kb/action', { action: action }); })
      .then(function (res) { if (res && res.applied === false) throw new Error('not applied'); })
      .then(syncSnapshot)
      .catch(function (e) { setPill('red', '发送失败'); throw e; });
  }

  // ---------- state polling ----------
  function poll() {
    getJson('/kb/state').then(function (s) {
      if (s.ok === false && s.reason === 'disabled') {
        setPill('red', '已停用');
        showBanner('warn', 'TV 键盘已在 LocalSend 设置中停用');
        return;
      }
      if (s.password) {
        showBanner('warn', '🔒 电视上是密码框：输入将经局域网明文传输，敏感密码建议现场手输');
      } else {
        hideBanner();
      }
      if (s.clients > 0) setPill('green', '已连接');
      else setPill('gray', '等待连接');
      if (s.visible) {
        hostLineUpdate();
      }
    }).catch(function () {
      setPill('red', '连接断开');
    });
  }

  function hostLineUpdate() {
    // nothing to update for now; kept for future TV text mirror
  }

  if (host) document.getElementById('hostLine').textContent = host;
  syncSnapshot().catch(function () {
    showBanner('err', '暂时无法读取电视输入框，请先点击电视上的输入框');
  });
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
